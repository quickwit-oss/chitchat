[package]
name = "chitchat-test"
version = "0.9.0"
edition = "2024"
rust-version = "1.86"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
chitchat = { version = "0.12.0", path = "../chitchat" }
cool-id-generator = "1"
poem = "3.1"
poem-openapi = { version = "5.1", features = ["swagger-ui"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
structopt = "0.3"
tokio = { version = "1.53", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing-subscriber = "0.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
] }
